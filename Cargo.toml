[package]
name = "oneq"
version = "0.3.1"
edition = "2024"
description = "Extension of jq with repl and more formats"
readme = "README.md"
homepage = "https://github.com/lumiknit/oneq"
repository = "https://github.com/lumiknit/oneq"
license = "MPL-2.0"
keywords = ["jq", "json", "cli", "devtools", "yaml", "toml"]

[[bin]]
name = "1q"
path = "src/main.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
indexmap = "2"
libm = "0.2"
pest = "2"
pest_derive = "2"
regex = "1.13"
rand_chacha = "0.10"
miniz_oxide = "0.9"
clap = { version="4", features=["derive", "env"] }
thiserror = "2"
strum = { version = "0.28", features = ["derive"] }
ryu = "1"
sha1 = "0.11"
sha2 = "0.11"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
rustyline = "18.0.1"
tempfile = "3"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
chrono = { version = "0.4", default-features = false, features = ["wasmbind"] }

[build-dependencies]
miniz_oxide = "0.9"

[dev-dependencies]
rayon = "1.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
