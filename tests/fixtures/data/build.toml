# Build configuration with dotted keys, nested tables and arrays of tables.
title = "서울 build farm"
version = 3
active = true
released = 2026-09-10T12:30:45+09:00
local_date = 2026-09-10
local_time = 12:30:45
local_datetime = 2026-09-10T12:30:45
message = """
Build ready.
Second line.
"""
path = 'C:\build\artifacts'
ports = [8000, 8001, 8002,]
matrix = [[1, 2], [], [3, 4]]
empty = {}
"keys.with.dots" = { "" = "empty key", "true" = "false" }
[numbers]
hex = 0xDEAD_BEEF
octal = 0o755
binary = 0b1010
large = 9_223_372_036_854_775_807
small = -9_223_372_036_854_775_808
float = 1.25e+3
[build.cache]
enabled = true
max_size = 1_024
[build]
name = "nightly"
options.optimization = 2
options.features = ["yaml", "toml"]
[[workers]]
name = "linux"
tags = ["x86_64", "fast"]
[workers.resources]
cpu = 8
memory = 16384
[[workers.jobs]]
name = "compile"
commands = ["cargo build", "cargo test"]
[[workers.jobs]]
name = "publish"
commands = []
[[workers]]
name = "windows"
tags = []
[workers.resources]
cpu = 4
memory = 8192
[[workers.jobs]]
name = "test"
commands = ["cargo test"]
[artifacts]
paths = ["target/release", "reports"]
metadata = { retention = 30, labels = { team = "infra", stable = true } }
